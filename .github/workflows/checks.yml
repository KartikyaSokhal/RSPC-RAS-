name: Verify Prepal
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHON_DOTENV_DISABLED: '1'
      GEMINI_API_KEY: ''
      GOOGLE_API_KEY: ''
      AI_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m venv backend/.venv
      - run: backend/.venv/bin/pip install --require-hashes -r backend/requirements-dev.txt
      - run: npm ci
      - run: npm run check
      - run: cd backend && .venv/bin/python run_tests.py && .venv/bin/python manage.py makemigrations --check --dry-run --settings=core.test_settings
      - run: backend/.venv/bin/python scripts/verify_budget_race.py
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: backend/.venv/bin/python scripts/prepare_demo.py
      - run: npm run test:integration
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: chromium-failure-evidence
          path: test-results/
          retention-days: 7
